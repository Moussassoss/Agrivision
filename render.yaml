services:
  - type: web
    name: cropvana-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    plan: starter          # $7/month — no spin-down, 512 MB RAM
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cropvana-db
          property: connectionString
      - key: ISDA_USERNAME
        sync: false
      - key: ISDA_PASSWORD
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "CropVana <onboarding@resend.dev>"
      - key: SENTRY_DSN
        sync: false
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.13.3"

databases:
  - name: cropvana-db
    databaseName: cropvana
    user: cropvana
    plan: starter          # $7/month — 1 GB storage, daily backups, no expiry
